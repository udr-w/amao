name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        env:
          OPENAI_API_KEY: test-openai-key
          ANTHROPIC_API_KEY: test-anthropic-key
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t amao:ci .

  real-docker-tester:
    # Runs PytestStrategy against an actual Docker daemon -- separate from
    # the mocked unit tests in the `test` job above. This project's own
    # history is why: mocked subprocess tests proved amao constructs the
    # right shell command, but only a live run ever caught that official
    # images run as root by default (root-owned files left in the project
    # dir) or that a non-root `pip install` falls back to a $PATH-less
    # --user mode. See TESTER_AGENT_PLAN.md. Scoped to PytestStrategy only
    # (python:3.12-slim, no custom image to build) to keep this fast --
    # the Chromium-based strategies' pre-built image takes minutes to
    # construct the first time and isn't worth that cost on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Test (real Docker, PytestStrategy only)
        run: pytest -m real_docker tests/test_testing_real_docker.py --no-cov
