[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "amao"
version = "0.2.0"
description = "Autonomous multi-agent orchestration engine for automated software delivery pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "amao contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.40,<3",
    "anthropic>=0.34,<1",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests>=2.31",
]

[project.scripts]
amao = "amao.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amao"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B"]
ignore = [
    "S101", # asserts are fine in tests
    "S311", # jitter/backoff randomness is not security-sensitive
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S607"]

[tool.mypy]
python_version = "3.10"
packages = ["amao"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=amao --cov-report=term-missing --cov-fail-under=75 -m 'not real_docker'"
# TesterAgent/TesterInfraError coincidentally match pytest's default Test*
# class-discovery pattern; both have __init__ so pytest correctly skips
# collecting them, but still warns about the name match. Benign, silence it.
filterwarnings = ["ignore::_pytest.warning_types.PytestCollectionWarning"]
markers = [
    "real_docker: needs an actual Docker daemon (not mocked); excluded from the default run, see CI's separate real-docker job",
]

[tool.coverage.run]
source = ["src/amao"]
